name: CI

# Lean gate for the Geoenergy fork: lint, typecheck/build, the frontend tests,
# and the dataset catalog's structure. Upstream's CI also checked the Rust
# desktop crate, the Python sidecar, and the Cloudflare workers, none of which
# exist here any more.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:frontend
      - run: npm run check:catalog
