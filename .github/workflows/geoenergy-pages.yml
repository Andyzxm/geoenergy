name: Deploy Geoenergy

# The upstream pages.yml also builds the documentation site with zensical and a
# JupyterLite bundle. This fork publishes just the web app, so the build stays a
# plain `npm ci && npm run build` and needs no Python toolchain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: geoenergy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Geoenergy web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate the dataset catalog
        # Structure only. The reachability pass (--net) is left to a scheduled
        # run or a local check: a third-party ArcGIS service that is briefly down
        # should not fail a deploy of the app itself.
        run: node scripts/check-geoenergy-catalog.mjs

      - name: Build
        run: npm run build -w geoenergy
        env:
          # Relative base so the build works under https://<user>.github.io/<repo>/.
          GEOLIBRE_APP_BASE: ./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/geoenergy/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
